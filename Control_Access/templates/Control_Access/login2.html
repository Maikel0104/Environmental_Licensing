{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <h2 class="text-center mb-4">Login</h2>

            <form method="post">
                {% csrf_token %}
                
                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
                    {{ form.password }}
                </div>
                
                <button type="submit" class="btn btn-success w-100">Entrar</button>
            </form>

            <div class="text-center mt-3">
                <p>Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
                <p><a href="{% url 'password_reset' %}">Esqueceu a senha?</a></p>
            </div>
        </div>
    </div>
{% endblock %}
