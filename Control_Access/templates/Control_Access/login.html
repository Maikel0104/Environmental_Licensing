{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> DEMMACHAT</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/template.css' %}">
      </head>
    <body class="cor_fundo_body">
      <div class="container-fluid">

        <!-- Cabeçalho da página -->
        <header class="row">
          <div class="col-12 col-sm-12 col-md-12 col-lg-12 text-center d-flex justify-content-around align-items-center cor_fundo_header header-demma">
            <img src="{% static 'img/Brasao-Vacaria.png' %}" alt="Brasão de Vacaria" class=" img-fluid" width="50px" height="50px">
            <label class="fs-1 text-light fw-bold p-5">DEMMA CHAT</label>
            <img src="{% static 'img/homem.png' %}" alt="foto perfil" class="rounded-circle img-fluid" width="50px" height="10px">
          </div>
        </header> 
        
        <!-- Corpo da página-->
        <div class="row">
          <div class="col-12 col-sm-10 col-md-8 col-lg-6 text-center mx-auto my-3">
            <form method="post" id="form" class="d-flex flex-column justify-content-center" style="min-height: 100vh;">
              {% csrf_token %}

              {% if form.non_field_errors %}
                <div class="alert alert-danger">
                  {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                  {% endfor %}
                </div>
              {% endif %}
              <!-- Posicionando a imagem da Secretaria da Agricultura e Meio Ambiente-->
              <div class="d-flex flex-column align-items-center">
                <img src="{% static 'img/demma1.png' %}" alt="Logo Demma" class="img-fluid rounded-circle mb-5 " width="200px" height="200px" >    
              </div>
              <!-- Layout Email-->
              <div>
                <div>
                  <label class="h2 my-4"> Endereço de Email </label>
                </div>
                <div>
                  {{ form.username }}
                  <p class="mensagem-erro"></p>
                </div>
              </div>

              <!-- Layout Senha -->
              <div>
                <div>
                  <label class="h2 my-4"> Senha </label>
                </div>
                <div>
                  {{ form.password }}
                  <p class="mensagem-erro"></p>
                </div>
              </div>

                <!-- Layout Salvar Login-->
              <div class="d-flex flex-column align-items-end">
                <a href="{% url 'password_reset' %}" id="esqueceu_senha">
                  Esqueceu Senha
                </a>
                <div class="form-group">
                  <input class="ms-5 " type="checkbox" id="checkbox">
                  <label for="checkbox">
                    Lembrar este dispositivo
                  </label>
                </div>
                
              </div>

                <!-- Layout enviar os dados-->
              <div class=" d-flex flex-column justify-content-center align-items-center mt-5">
                <div>
                  <button type="submit" id="myentrar" class="btn btn-success btn-lg p-3 mx-5">
                  <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    Entrar
                  </button>
                </div> 
                <div>
                  <a href="{% url 'cadastro' %}">
                    <button id="cadastrar_conta" type="button" class="form-control cor_botao_cadastrar mt-3">
                      Cadastrar Conta
                    </button>  
                  </a>
                </div>                
              </div>
            </form>
        </div>
      </div> 
      
      <script src="https://kit.fontawesome.com/cc8e4b5f64.js" crossorigin="anonymous"></script>
      <script src="{% static 'js/Script.js' %}"></script>
    </body>
</html>
