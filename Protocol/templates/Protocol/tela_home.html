{% extends "base.html" %}
{% block content %}
    <nav class="d-flex justify-content-between align-items-center mb-5">
        
        <a href="{% url 'novo_pedido' %}" class="btn btn-secondary btn-lg">
            <i class="fa-solid fa-circle-plus me-2"></i> Novo Pedido
        </a>
        <!-- O logout o django aceita somente POST e não get, por isso foi criado um formulário para POST-->
        <form action="{% url 'logout' %}" method="POST" class="d-inline">
            {% csrf_token %}

            <button type="submit" class="btn btn-secondary btn-lg">
                Sair
                <i class="fa-solid fa-right-from-bracket ms-2"></i>
            </button>
        </form>
    </nav>

    <div class="row justify-content-center mt-5">
        
        <div class="col-md-5 mb-4">
            <a href="{% url 'historico_licencas' %}" class="menu-card text-decoration-none text-dark d-block p-5 text-center shadow-sm rounded">
                <i class="fa-solid fa-scroll fa-3x"></i> <h2 class="mt-3 fw-bold">Licenças</h2>
            </a>
        </div>

        <div class="col-md-5 mb-4">
            <a href="{% url 'historico_denuncias' %}" class="menu-card text-decoration-none text-dark d-block p-5 text-center shadow-sm rounded">
                <i class="fa-solid fa-bullhorn fa-3x"></i> <h2 class="mt-3 fw-bold">Denúncias</h2>
            </a>
        </div>
    </div>
{% endblock %}
