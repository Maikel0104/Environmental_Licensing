{% extends "base.html" %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        
        <a href="{% url 'menu_principal' %}" class="btn btn-light btn-lg border">
            <i class="fa-solid fa-arrow-left me-2"></i>
            Voltar
        </a>

        <form action="{% url 'logout' %}" method="POST" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-light btn-lg border">
                Sair
                <i class="fa-solid fa-right-from-bracket ms-2"></i>
            </button>
        </form>    
    </div>

    <div class="row justify-content-center">
        <div class="col-md-10"> 
            <div class="form-box-demma p-4 p-md-5 rounded shadow-sm">
                <h2 class="fw-bold text-center mb-4">Novo Pedido</h2>

                <form action="{% url 'novo_pedido' %}" method="POST">
                    
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success btn-lg px-5">Enviar</button>
                    </div>

                </form> 
            </div> 
        </div> 
    </div>
{% endblock%}
